name: CI

# Porta de qualidade: lint + typecheck + testes do dashboard e py_compile dos scripts Python.
# package-lock.json é committado, e o CI usa `npm ci` para build determinístico.
#
# ---------------------------------------------------------------------------
# O NODE AQUI É 24 PORQUE 24 É O QUE VAI PARA O SERVIDOR DO ÓRGÃO.
# ---------------------------------------------------------------------------
# É a mesma versão dos três estágios do Dockerfile (ADR-0025) e a que o
# `engines.node` do package.json exige (>=24.0.0).
#
# Até 22/09/2026 este arquivo pedia a 20, e o comentário que ficava aqui afirmava
# que 20 era também a versão da imagem. Era falso desde a ADR-0025: a imagem já
# estava em `node:24-alpine`. O efeito é que a porta de qualidade aprovava o
# código num runtime que ninguém entrega, e o runtime entregue só era exercitado
# por quem rodasse `docker build` na mão.
#
# Não é diferença cosmética. No lock, 20 pacotes declaram `engines.node` que a 20
# não satisfaz, entre eles o `tedious` (driver do SQL Server do órgão, ADR-0023),
# o `@azure/identity`, que é a autenticação dele, e o `@supabase/supabase-js`.
# Como o projeto não tem `engine-strict`, o `npm ci` só avisa e segue: a
# divergência era silenciosa por construção. Somado a isso, a linha 20 saiu de
# suporte em 30/04/2026 (calendário oficial do nodejs/Release), e sistema de
# governo não se valida em runtime que não recebe mais correção de segurança.
#
# Consequência prática: o CI passa a rodar com npm 11, igual à imagem. O
# `npm run lock:ci`, que fixa o npm 10 para gerar o lock, deixa de ser
# obrigatório, porque não sobrou ninguém rodando npm 10. O lock atual, gerado
# pelo npm 10, foi provado em 22/09/2026 com `npm ci` sob npm 11.19.0 dentro do
# `node:24-alpine`, exit 0.
#
# Ao mudar a versão do Node no Dockerfile, mudar aqui também. Não existe guarda
# comparando os dois arquivos, e foi essa ausência que deixou a divergência
# durar: a `tests/unit/infrastructure/proxy-saida-internet.test.ts` cobre só o
# Dockerfile. A versão é escrita literalmente ('24') em vez de derivada do
# `engines`, porque `>=24.0.0` resolveria para a maior versão disponível e
# passaria da imagem no dia em que sair uma linha nova.
#
# Lacuna conhecida em 22/09/2026: nenhum job aqui roda `next build`. Erro que só
# aparece na construção do pacote de produção continua sendo detectado apenas no
# `docker build`, que é manual. Fechar isso custa minuto de Actions e a decisão
# está em aberto.

# A branch de trabalho entra no gatilho de propósito. Ela é onde o
# desenvolvimento acontece desde 19/08/2026, e até 08/09 acumulou cerca de 35
# commits que NUNCA passaram por esta porta: o gatilho só cobria `main`, e a
# fusão para `main` ainda não aconteceu. CI que não roda no lugar onde o código
# é escrito não é porta de qualidade, é enfeite.
#
# É uma branch nomeada e não um curinga porque cada execução gasta minuto de
# Actions em `ubuntu-latest`, e a conta do GitHub é assunto aberto na operação.
# Quando esta branch for fundida, a linha sai junto: o `main` volta a bastar.
on:
  push:
    branches: [main, chore/preparar-container-prodesp-offline]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — install, lint, typecheck, testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  integracao:
    name: Integração — schema e fluxo transacional em Postgres
    runs-on: ubuntu-latest
    # Prova contra Postgres de verdade o que o mock in-memory não alcança:
    # atomicidade, idempotência sob concorrência, coluna GENERATED, índice único
    # parcial. Exigência escrita da ADR 0021. Também garante que as migrations
    # aplicam do zero e suportam reexecução, que é como o deploy on-prem roda.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: spaguas
          POSTGRES_PASSWORD: spaguas
          POSTGRES_DB: spaguas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaguas -d spaguas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://spaguas:spaguas@localhost:5432/spaguas_test
      PGPASSWORD: spaguas
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Aplicar schema (shim de auth + migrations, do zero)
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/auth-compat.sql
          for arquivo in $(ls supabase/migrations/*.sql | sort); do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done

      # Sem este passo a reaplicação abaixo roda sobre banco VAZIO, e banco vazio
      # faz a migration certa e a errada passarem igual. Foi assim que dois
      # índices transitórios chegaram à produção e derrubaram o serviço
      # (0045 em 10/09/2026, 0057 em 22/09/2026).
      - name: Semear o estado real de produção (a régua sem isto mede o vazio)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/testing/regua-migrations/semear-estado-de-producao.sql

      - name: Reaplicar tudo (as migrations têm que ser idempotentes)
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/auth-compat.sql
          for arquivo in $(ls supabase/migrations/*.sql | sort); do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done

      - name: Conferir a reaplicação e limpar a semeadura
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/testing/regua-migrations/conferir-reaplicacao.sql

      - name: Testes de integração
        run: npx vitest run tests/integration

      # Este job fica verde com seis arquivos inteiros pulados, porque eles falam
      # com o SQL Server do órgão e isso exige a VPN, que o runner nunca terá.
      # Verde silencioso sobre teste que não rodou é boa notícia falsa: o passo
      # abaixo diz, no log, o que este verde NÃO mediu, e reprova se algum
      # arquivo que fala com o SQL Server esquecer a guarda de skip (sem ela o
      # job quebraria tentando conectar).
      - name: Anunciar o que este verde NAO mediu (precisa da VPN do orgao)
        run: |
          # O `|| true` não é descuido: o Actions roda com `set -e`, e sem ele um
          # grep sem resultado aborta o passo AQUI, antes da mensagem do piso lá
          # embaixo. Reprovaria mudo, e log de CI que reprova sem dizer o motivo
          # é pior que ausente.
          COM_GUARDA=$(grep -lE 'process\.env\.SQLSERVER_HOST.*\? describe : describe\.skip' tests/integration/*.test.ts | sort || true)
          QTD_ARQ=$(printf '%s\n' "$COM_GUARDA" | grep -c '^tests/' || true)
          # `[.(]` em vez de `\(` porque `it.each(...)` também é caso, e a âncora de
          # início de linha é o que impede `.test(p)` de um regex entrar na conta.
          #
          # A contagem é estática de propósito, e é um PISO, não o total: em
          # 23/09/2026 ela dá 67 e o número real é 72, porque um `it.each` gera
          # vários casos. Contar pela ferramenta não é opção: medido no mesmo dia,
          # `vitest list` devolve zero caso para estes arquivos e 3 para todo
          # `tests/integration`, porque ele lista só o que rodaria, e o que eu
          # quero contar é exatamente o que ele pula. O total exato aparece no log
          # do passo anterior, nas linhas `↓ arquivo (N tests | N skipped)`.
          QTD_CASOS=$(grep -hoE '^[[:space:]]*(it|test)[.(]' $COM_GUARDA | wc -l || true)

          # Piso contra leitura vazia. Em 23/09/2026 são 6 arquivos; zero aqui não
          # quer dizer que a dívida acabou, quer dizer que a expressão parou de
          # casar com o código, e daí este passo viraria enfeite verde.
          if [ "$QTD_ARQ" -lt 1 ]; then
            echo "::error title=Regua quebrada::nenhum arquivo casou a guarda de SQLSERVER_HOST. O padrao no codigo mudou: corrigir a expressao deste passo."
            exit 1
          fi

          echo "::notice title=Medicao pendente::$QTD_ARQ arquivo(s) e ao menos $QTD_CASOS caso(s) de integracao NAO rodaram aqui: falam com o SQL Server do orgao e exigem a VPN, que este runner nao tem. Medir na bancada com a VPN ligada."
          echo "Arquivos que este job NAO mediu:"
          printf '%s\n' "$COM_GUARDA"

          # Quem fala com o SQL Server sem a guarda não pula: tenta conectar e
          # derruba o job. Esta metade reprova de verdade.
          FALTANDO=""
          for arquivo in tests/integration/*mssql*.test.ts; do
            [ -e "$arquivo" ] || continue
            if ! printf '%s\n' "$COM_GUARDA" | grep -qxF "$arquivo"; then
              FALTANDO="$FALTANDO $arquivo"
            fi
          done
          if [ -n "$FALTANDO" ]; then
            echo "::error title=Guarda de skip ausente::falam com o SQL Server sem guarda de SQLSERVER_HOST:$FALTANDO"
            exit 1
          fi

  python:
    name: Python — sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compilar módulos para detectar erros de sintaxe
        run: |
          python -m py_compile ops/importer/import_csv.py
          python -m py_compile ops/indexer/index_fs.py
