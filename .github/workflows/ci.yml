name: CI

# Porta de qualidade: lint + typecheck + testes do dashboard e py_compile dos scripts Python.
# package-lock.json é committado — CI usa `npm ci` para build determinístico.
#
# O Node aqui é o mesmo do Dockerfile de produção (20), então o `npm ci` roda com
# npm 10. Um lock gerado por npm 11 (Node 22+) omite entradas aninhadas que o npm 10
# exige e quebra o `npm ci` só no CI. Depois de mexer em dependência, regenerar com
# `npm run lock:ci` antes do push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — install, lint, typecheck, testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  python:
    name: Python — sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compilar módulos para detectar erros de sintaxe
        run: |
          python -m py_compile ops/importer/import_csv.py
          python -m py_compile ops/indexer/index_fs.py
