# =============================================================================
# SP Aguas - DMO | bloco de Nginx para o servidor do orgao
# =============================================================================
# ESTE ARQUIVO NAO E PARA SER COPIADO POR CIMA DE NADA.
#
# O servidor ja tem um site configurado e funcionando em
# /etc/nginx/sites-available/default (server_name dmo.spaguas.sp.gov.br,
# escutando 80 e 443, com o certificado Let's Encrypt e o `location /portainer/`
# ja correto). O que este arquivo traz e SO o conteudo definitivo do bloco
# `location /`, para ser aplicado ali dentro, e a lista do que sai.
#
# Escrito a partir da configuracao REAL medida no servidor em 27/08/2026, e nao
# de um modelo generico.
#
# Conferir depois de editar, sempre nesta ordem:
#   sudo nginx -t                  # sintaxe
#   sudo systemctl reload nginx    # aplica sem derrubar conexao
#   sudo nginx -T | sed -n '/server_name dmo/,/^}/p'   # o que ficou VALENDO
#
# A terceira linha nao e zelo: `nginx -t` responde "ok" sobre o ARQUIVO, e o que
# decide comportamento e o efeito. Ver o mesmo erro em SSH: config valida e sem
# efeito porque outro fragmento tinha precedencia.
# =============================================================================


# -----------------------------------------------------------------------------
# PARTE 1 | O QUE REMOVER do `location /` atual
# -----------------------------------------------------------------------------
# As cinco linhas abaixo estao ATIVAS hoje e precisam sair. Nao comentar: sair.
#
#   try_files $uri $uri/ =404;
#   proxy_cache PROXYCACHE;
#   proxy_cache_valid 200 302 10m;
#   proxy_cache_valid 404 1m;
#   add_header X-Proxy-Cache $upstream_cache_status;
#
# POR QUE `try_files` SAI (esta e a linha que impede o sistema de funcionar):
#   `try_files` e resolvido ANTES do `proxy_pass`, na fase de conteudo. Ele
#   procura o caminho pedido no sistema de arquivos do site e, como o ultimo
#   elemento e `=404`, encerra ali quando nao acha. O site nao tem os arquivos
#   da aplicacao em disco (quem os serve e o container), entao TODA requisicao
#   terminaria em 404 sem nunca chegar ao `proxy_pass`. Com `try_files` no bloco,
#   o `proxy_pass` e codigo morto. Isso vale mesmo com o `proxy_pass` escrito
#   logo abaixo dele.
#
# POR QUE O CACHE SAI (as quatro linhas restantes):
#   1. A chave de cache deste servidor esta definida no bloco `http` como
#      "$scheme$request_method$host$request_uri", e NAO inclui cookie. Dois
#      usuarios autenticados diferentes pedindo /postos/1D-002 produzem a MESMA
#      chave. O que separa uma resposta da outra hoje e so o cabecalho
#      `Cache-Control: private, no-store` que a aplicacao envia, e que o Nginx
#      respeita porque nao existe `proxy_ignore_headers` em lugar nenhum da
#      configuracao (medido). Ou seja: a protecao contra servir a pagina de um
#      usuario para outro esta INTEIRA do lado da aplicacao, num cabecalho que
#      ela precisa lembrar de mandar em toda resposta.
#   2. E ela nao manda em toda resposta. O `matcher` do middleware
#      (src/middleware.ts, final do arquivo) exclui de proposito tudo que termina
#      em .js, .json, .txt, .map, .css e extensao de imagem. Qualquer rota que
#      caia fora do middleware, hoje ou numa mudanca futura de matcher, passa a
#      ser cacheada por 10 minutos e servida para todo mundo, em silencio.
#   3. Este projeto JA teve esse incidente. O comentario em src/middleware.ts,
#      linhas 69-79, registra 18/05/2026: "Vistos recentemente" de um usuario
#      aparecendo para outro, sinal de cache entre usuarios em camada
#      intermediaria. A defesa foi posta na aplicacao; ligar um cache
#      compartilhado sem cookie na chave reabre exatamente a mesma porta.
#   4. `proxy_cache_valid 404 1m` guarda o 404. Na janela em que o container
#      ainda esta subindo, o 404 daquele instante e servido a todos por um
#      minuto DEPOIS de a aplicacao estar sa.
#   5. O ganho e proximo de zero. Quase toda resposta depende do usuario
#      autenticado; o que e realmente cacheavel (`/_next/static/*`) ja sai da
#      aplicacao com `immutable` e um ano de validade, que o NAVEGADOR respeita
#      sozinho; e o destino do proxy esta em 127.0.0.1, onde a ida e volta custa
#      menos de um milissegundo.
#   6. `add_header X-Proxy-Cache` tem um efeito colateral que quase ninguem ve:
#      um `add_header` dentro de um `location` DESCARTA todos os `add_header`
#      herdados do `server` e do `http`. Se o orgao tiver qualquer cabecalho de
#      seguranca definido no nivel de cima, ele some so nesta rota. Conferir com
#      `sudo nginx -T | grep -n add_header` antes e depois.
#
# O `proxy_cache_path ... keys_zone=PROXYCACHE:10m` no bloco `http` pode ficar
# como esta: sem nenhum `proxy_cache` referenciando a zona, ela fica apenas
# declarada e sem uso. Nao ha necessidade de mexer no bloco `http` do orgao.


# -----------------------------------------------------------------------------
# PARTE 2 | O `location /` definitivo
# -----------------------------------------------------------------------------
# Colar no lugar do `location /` atual, dentro do server que ja escuta 443 com
# server_name dmo.spaguas.sp.gov.br. O `location /portainer/` do orgao nao e
# tocado: ele e um prefixo mais especifico e continua tendo precedencia.

location / {
    # Destino: o container publica APENAS em 127.0.0.1:3000 (ver
    # docker-compose.prod.yml). Endereco literal, e nao nome: o servidor nao
    # resolve DNS externo, e um nome aqui viraria uma dependencia a toa.
    proxy_pass http://127.0.0.1:3000;

    # HTTP/1.1 no lado de cima. O default do proxy do Nginx e 1.0, que fecha a
    # conexao a cada resposta e nao suporta resposta em pedacos (chunked). O
    # Next 15 (App Router) envia HTML em fluxo; com 1.0 a resposta e bufferizada
    # inteira antes de sair.
    proxy_http_version 1.1;
    # Limpa o "Connection: close" que o 1.0 injetaria, permitindo reaproveitar a
    # conexao com o container.
    proxy_set_header Connection "";

    # Identidade da requisicao original. Sem estes quatro, a aplicacao acha que
    # esta em http://127.0.0.1:3000: os enderecos absolutos que ela gera (link de
    # confirmacao, retorno de autenticacao, canonical) saem apontando para
    # localhost, e o registro de auditoria grava o IP do proprio servidor no
    # lugar do IP de quem agiu. Num sistema de governo com trilha de auditoria,
    # perder o IP de origem e perder a trilha.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache compartilhado DESLIGADO, explicitamente. Nao basta remover as linhas
    # de cache: escrito assim, um `proxy_cache` que alguem venha a definir no
    # bloco `http` no futuro nao e herdado por esta rota. Justificativa completa
    # na Parte 1.
    proxy_cache off;

    # Sem bufferizacao da resposta: entrega os pedacos do HTML em fluxo ao
    # navegador conforme a aplicacao os produz, que e como o App Router foi
    # feito para responder. Com o default (`on`), o Nginx segura a resposta ate
    # ter tudo, e a pagina so aparece no fim.
    proxy_buffering off;
    # A bufferizacao do PEDIDO continua ligada (default): o corpo do envio chega
    # completo antes de ir para a aplicacao, o que protege o container de
    # cliente lento (Slowloris).
    proxy_request_buffering on;

    # Tamanho maximo do corpo. NAO e numero escolhido no olho: o envio da foto
    # de capa do posto aceita um data URL de ate 7 MB
    # (src/app/api/app/postos/[prefixo]/foto/route.ts, MAX_CHARS_DATA_URL), que
    # viaja dentro de um JSON. O default do Nginx e 1 MB: sem esta linha, todo
    # envio de foto de campo morre com 413 ANTES de chegar a aplicacao, e a
    # mensagem de erro nao vem da aplicacao, o que manda procurar no lugar
    # errado. 12 MB cobre os 7 MB mais o resto do JSON com folga, e continua
    # sendo um teto.
    client_max_body_size 12m;

    # Tempos. `connect` curto porque o destino e loopback: se nao conectou em
    # 5 s, o container esta fora, e falhar rapido e melhor que pendurar o
    # trabalhador do Nginx. `read` longo porque geracao de relatorio e
    # exportacao de planilha passam dos 60 s do default em lote grande, e o
    # sintoma de estourar e um 504 sem explicacao.
    proxy_connect_timeout 5s;
    proxy_send_timeout   120s;
    proxy_read_timeout   120s;

    # Nao reescrever o cabecalho Location das respostas de redirecionamento: a
    # aplicacao ja os emite com o caminho certo, e a reescrita automatica trocaria
    # o dominio publico pelo endereco interno.
    proxy_redirect off;
}


# -----------------------------------------------------------------------------
# PARTE 3 | O que NAO entra, e por que (revisao da recomendacao anterior)
# -----------------------------------------------------------------------------
#
# 3.1  NAO acrescentar `location /.well-known/acme-challenge/`.
#
#      A recomendacao anterior previa uma rota de webroot para o desafio do
#      Certbot. Ela cai diante do que foi medido: o renovador deste servidor esta
#      configurado com `authenticator = nginx`, e nao com webroot. O modulo
#      nginx do Certbot nao usa diretorio nenhum: na hora da renovacao ele
#      escreve, ELE MESMO, um `location` de correspondencia exata dentro do
#      server, responde o desafio de dentro do proprio Nginx, recarrega, valida e
#      desfaz a alteracao. Correspondencia exata tem precedencia sobre o `location
#      /` acima, entao o `proxy_pass` nao atrapalha, e uma rota de webroot escrita
#      a mao seria configuracao morta.
#
#      A ressalva que precisa ficar escrita, porque ela morde depois: SE o orgao
#      trocar o autenticador para webroot, essa rota passa a ser OBRIGATORIA. Sem
#      ela, o pedido de desafio cai no `location /`, chega a aplicacao, e o
#      middleware de autenticacao responde um redirecionamento 307 para /login,
#      porque /.well-known nao esta na lista de rotas publicas. O Let's Encrypt le
#      isso como desafio invalido, e a mensagem de erro fala de arquivo ausente, o
#      que manda procurar em disco um problema que e de autenticacao.
#
# 3.2  NAO acrescentar cabecalho de seguranca aqui.
#
#      HSTS, CSP com nonce por requisicao, X-Frame-Options, Referrer-Policy,
#      Permissions-Policy e as politicas de origem cruzada ja saem da aplicacao
#      (next.config.ts e src/middleware.ts) e atravessam o proxy intactas.
#      Repeti-los no Nginx produz cabecalho em duplicidade e, no caso da CSP,
#      DUAS politicas valendo ao mesmo tempo, o que o navegador resolve aplicando
#      a INTERSECAO das duas: a pagina quebra de um jeito que nao aparece em
#      nenhum teste e so no console de quem abrir a tela.
#      Conferir o que o orgao ja define: `sudo nginx -T | grep -n add_header`.
#
# 3.3  Opcional, e so se houver medicao pedindo: pool de conexao com o container.
#
#      upstream dmo_app { server 127.0.0.1:3000; keepalive 32; }
#      ... e trocar o destino por `proxy_pass http://dmo_app;`
#
#      Ganho real: evita acumular soquetes em TIME_WAIT no loopback sob carga.
#      Custo: mexe no bloco `http` do orgao, que hoje nao precisamos tocar.
#      Fica registrado como melhoria, nao como parte da entrega.
